{% extends 'base.html' %}

{% block body %}
<!DOCTYPE html>
<html>
<head>
  <style>
    form {
      border-radius: 5px;
      background-color: #f2f2f2;
      padding: 20px;
      max-width: 600px;
      margin: 30px auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 15px;
      margin-bottom: 6px;
      color: #333;
    }

    input[type=text], select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
      transition: border-color 0.3s ease;
      resize: vertical;
    }

    input[type=text]:focus, select:focus, textarea:focus {
      border-color: #4CAF50;
      outline: none;
    }

    input[type=submit] {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    input[type=submit]:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<h2 style="text-align:center; color:#04AA6D; margin-bottom: 25px;">Edit Patient</h2>

<form action="" method="POST">
  {% csrf_token %}
  
  <label for="fname">Name</label>
  <input type="text" id="fname" name="name" value="{{ patient.name }}" placeholder="Your name..">

  <label for="age">Age</label>
  <input type="text" id="age" name="age" value="{{ patient.age }}" placeholder="Your age..">

  <label for="gender">Gender</label>
  <select id="gender" name="gender">
    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
    <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
  </select>

  <label for="phone">Phone</label>
  <input type="text" id="phone" name="phone" value="{{ patient.phone }}" placeholder="Your phone..">

  <label for="address">Address</label>
  <textarea name="address" id="address" rows="3">{{ patient.address }}</textarea>

  <label for="doctor">Doctor</label>
  <select name="doctor" id="doctor">
    <option value="">--select--</option>
    {% for d in doctor_data %}
      <option value="{{ d.id }}" {% if patient.doctor.id == d.id %}selected{% endif %}>{{ d.name }}</option>
    {% endfor %}
  </select>

  <input type="submit" value="Edit">
</form>

</body>
</html>
{% endblock body %}
