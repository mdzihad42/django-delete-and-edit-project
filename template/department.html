{% extends 'base.html' %}

{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Font Awesome CDN for icons -->
 <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-p1PKM+/bR2F2e7JkTf/FCjKqHcFnf9aR7p+AO0xCdjTQlBj5QHXpOBMY+Fxf7kPQqfSvL+YJKM1YB5yXBuMxww=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
 <style>
    form {
      border-radius: 5px;
      background-color: #f2f2f2;
      padding: 20px;
      max-width: 600px;
      margin: 20px auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 15px;
      margin-bottom: 6px;
      color: #333;
    }

    input[type=text], select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
      transition: border-color 0.3s ease;
      resize: vertical;
    }

    input[type=text]:focus, select:focus, textarea:focus {
      border-color: #4CAF50;
      outline: none;
    }

    input[type=submit] {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    input[type=submit]:hover {
      background-color: #45a049;
    }

    h2, h1 {
      text-align: center;
      color: #04AA6D;
      margin-top: 30px;
      margin-bottom: 20px;
    }

    /* Table styling */
    table {
      font-family: Arial, Helvetica, sans-serif;
      border-collapse: collapse;
      width: 90%;
      margin: 20px auto 40px auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px 12px;
      text-align: left;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #eaeaea;
    }

    th {
      background-color: #04AA6D;
      color: white;
      font-weight: 600;
      font-size: 16px;
    }

    /* Filter form */
    form[action=""] select,
    form[action=""] button {
      width: auto;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
      padding: 8px 14px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
      cursor: pointer;
      background-color: white;
      transition: background-color 0.3s ease;
    }

    form[action=""] button:hover {
      background-color: #04AA6D;
      color: white;
      border-color: #04AA6D;
    }

    form[action=""] button a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    /* Edit and Delete buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      margin-right: 5px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
      color: white;
    }

    .btn-edit {
      background-color: #4CAF50;
    }

    .btn-edit:hover {
      background-color: #45a049;
    }

    .btn-delete {
      background-color: #f44336;
    }

    .btn-delete:hover {
      background-color: #da190b;
    }

    .btn i {
      margin-right: 6px;
    }

    td:last-child {
      white-space: nowrap;
      width: 130px;
    }
  </style>
</head>
<body>

  <h2>department</h2>

  <form action="" method="POST">
    {% csrf_token %}
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name.." required>
    <label for="name">location</label>
    <input type="text" id="name" name="location" placeholder="Your location.." required>

    <input type="submit" value="Submit">
  </form>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>location</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for i in department %}
      <tr>
        <td>{{ i.name }}</td>
        <td>{{ i.location }}</td>
        <td>
          <a href="{% url 'departEdit' i.id %}" class="btn btn-edit" title="Edit Doctor">
            <i class="fa-solid fa-pen-to-square"></i> Edit
          </a>
          <a href="{% url 'departmentDelete' i.id %}" class="btn btn-delete" title="Delete Doctor">
            <i class="fa-solid fa-trash"></i> Delete
          </a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="6" style="text-align:center; color:#888;">No doctors found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

</body>
</html>
{% endblock body %}
